[env:esp32s3]
platform = espressif32
; Используем стандартную плату DevKit для S3, она отлично подходит по пинам
board = esp32-s3-devkitc-1
framework = espidf

; Скорость вывода в терминал
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Настройки памяти платы (16MB Flash, включение PSRAM)
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi 
build_flags = 
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue